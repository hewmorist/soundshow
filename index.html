<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soundshow</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0b0b;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100vh;display:grid;place-items:center}
.hidden{display:none!important}
button,.choose{font:inherit;cursor:pointer;border:1px solid #555;background:#181818;color:#fff;border-radius:999px;padding:.85rem 1.25rem}
button:hover,.choose:hover{background:#292929}
.loader,.ready{text-align:center;width:min(92vw,720px);padding:2rem}
.loader h1,.ready h1{font-size:clamp(2.5rem,7vw,5rem);margin:0 0 .5rem}
.loader>p,.ready>p{color:#aaa}
#fileInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.choose{display:inline-block;background:#fff;color:#111;border-color:#fff;font-weight:700;margin-top:1rem}
.drop{margin:2rem auto 0;border:2px dashed #555;border-radius:18px;padding:3rem 1rem;color:#aaa}
.drop.over{border-color:#fff;color:#fff;background:#171717}
.status{min-height:1.5rem;color:#f0a0a0!important}
.file-note{font-size:.9rem;color:#777!important}
.ready button{margin:.35rem}
#startBtn{background:#fff;color:#111;border-color:#fff;font-size:1.08rem}
.secondary{background:transparent;color:#bbb}
.show{width:min(100vw,1100px);padding:16px}
.stage{position:relative;aspect-ratio:1/1;max-height:76vh;margin:auto;overflow:hidden;border-radius:18px;background:#111}
.stage img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .55s ease}
.stage img.visible{opacity:1}
.shade{position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.8));pointer-events:none}
.copy{position:absolute;left:0;right:0;bottom:0;padding:clamp(1rem,4vw,2.5rem)}
.copy h2{font-size:clamp(1.7rem,5vw,3.5rem);margin:0 0 .25rem;text-shadow:0 2px 12px #000}
.copy p{font-size:clamp(1rem,2vw,1.25rem);margin:0;color:#ddd}
.controls{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:14px 2px}
#counter{color:#999}
.lower{text-align:center;padding-bottom:8px}
.player-wrap{height:1px;overflow:hidden;opacity:.01}
#scPlayer{width:100%;height:166px;border:0}
@media(max-width:600px){.show{padding:8px}.stage{border-radius:10px}.drop{padding:2rem 1rem}}
</style>
</head>
<body>
<main>
<section id="loader" class="loader">
  <h1>Soundshow</h1>
  <p>Open a Soundshow presentation from your computer.</p>
  <label class="choose" for="fileInput">Choose JSON file</label>
  <input id="fileInput" type="file" accept=".json,application/json">
  <div id="dropZone" class="drop">or drag and drop a <strong>.json</strong> file here</div>
  <p id="status" class="status"></p>
  <p class="file-note">The presentation is read locally by your browser.</p>
</section>

<section id="ready" class="ready hidden">
  <h1 id="showTitle">Soundshow</h1>
  <p id="slideCount"></p>
  <button id="startBtn">Start slideshow</button>
  <button id="anotherBtn" class="secondary">Choose another file</button>
</section>

<section id="show" class="show hidden">
  <div class="stage">
    <img id="slideImage" alt="">
    <div class="shade"></div>
    <div class="copy"><h2 id="slideTitle"></h2><p id="slideCaption"></p></div>
  </div>
  <div class="controls">
    <button id="prevBtn">‹ Previous</button><span id="counter"></span><button id="nextBtn">Next ›</button>
  </div>
  <div class="lower"><button id="exitBtn" class="secondary">Open another Soundshow</button></div>
  <div class="player-wrap"><iframe id="scPlayer" title="SoundCloud player" allow="autoplay"></iframe></div>
</section>
</main>

<script>
"use strict";
let config=null, index=0;
const $=id=>document.getElementById(id);
const loader=$("loader"), ready=$("ready"), show=$("show"), input=$("fileInput"),
      drop=$("dropZone"), status=$("status"), player=$("scPlayer"), img=$("slideImage");

function scEmbed(url){
  return "https://w.soundcloud.com/player/?url="+encodeURIComponent(url)+
  "&auto_play=true&hide_related=true&show_comments=false&show_reposts=false&visual=false";
}
function validate(d){
  if(!d || typeof d!=="object") throw new Error("JSON root must be an object.");
  if(!Array.isArray(d.slides) || !d.slides.length) throw new Error("No slides were found.");
  d.slides.forEach((s,i)=>{
    if(!s || typeof s!=="object") throw new Error("Slide "+(i+1)+" is invalid.");
    if(typeof s.image!=="string" || !s.image) throw new Error("Slide "+(i+1)+" has no image.");
  });
  return d;
}
async function loadFile(file){
  if(!file) return;
  status.textContent="Reading "+file.name+"…";
  try{
    const text=await file.text();
    config=validate(JSON.parse(text));
    $("showTitle").textContent=config.title||"Soundshow";
    $("slideCount").textContent=config.slides.length+" slide"+(config.slides.length===1?"":"s")+" loaded from "+file.name;
    status.textContent="";
    loader.classList.add("hidden");
    show.classList.add("hidden");
    ready.classList.remove("hidden");
  }catch(e){
    status.textContent="Could not open Soundshow: "+e.message;
  }
}
function render(n){
  index=(n+config.slides.length)%config.slides.length;
  const s=config.slides[index];
  img.classList.remove("visible");
  const pre=new Image();
  pre.onload=()=>{
    img.src=s.image; img.alt=s.title||"";
    requestAnimationFrame(()=>img.classList.add("visible"));
  };
  pre.onerror=()=>{ status.textContent="Could not load image for slide "+(index+1); };
  pre.src=s.image;
  $("slideTitle").textContent=s.title||"";
  $("slideCaption").textContent=s.caption||"";
  $("counter").textContent=(index+1)+" / "+config.slides.length;
  player.src=s.soundcloud?scEmbed(s.soundcloud):"about:blank";
}
function reset(){
  player.src="about:blank"; input.value=""; config=null;
  show.classList.add("hidden"); ready.classList.add("hidden"); loader.classList.remove("hidden");
}
input.addEventListener("change",()=>loadFile(input.files && input.files[0]));
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>loadFile(e.dataTransfer.files && e.dataTransfer.files[0]));
$("startBtn").addEventListener("click",()=>{ready.classList.add("hidden");show.classList.remove("hidden");render(0)});
$("anotherBtn").addEventListener("click",reset);
$("exitBtn").addEventListener("click",reset);
$("prevBtn").addEventListener("click",()=>render(index-1));
$("nextBtn").addEventListener("click",()=>render(index+1));
document.addEventListener("keydown",e=>{
  if(show.classList.contains("hidden"))return;
  if(e.key==="ArrowLeft")render(index-1);
  if(e.key==="ArrowRight")render(index+1);
});
</script>
</body>
</html>
