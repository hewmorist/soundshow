<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Soundshow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="loader" class="loader">
      <h1>Soundshow</h1>
      <p>Open a Soundshow presentation from your computer.</p>

      <label class="choose" for="fileInput">Choose JSON file</label>
      <input id="fileInput" type="file" accept=".json,application/json">

      <div id="dropZone" class="drop-zone">
        or drag and drop a <strong>.json</strong> file here
      </div>
      <p id="status" class="status"></p>
    </section>

    <section id="readyScreen" class="ready-screen hidden">
      <h1 id="showTitle">Soundshow</h1>
      <p id="slideCount"></p>
      <button id="startBtn">Start slideshow</button>
      <button id="chooseAnotherBtn" class="secondary">Choose another file</button>
    </section>

    <section id="show" class="show hidden">
      <div class="stage">
        <img id="slideImage" alt="">
        <div class="shade"></div>
        <div class="copy">
          <h2 id="slideTitle"></h2>
          <p id="slideCaption"></p>
        </div>
      </div>

      <div class="controls">
        <button id="prevBtn">‹ Previous</button>
        <span id="counter"></span>
        <button id="nextBtn">Next ›</button>
      </div>

      <div class="lower-controls">
        <button id="exitBtn" class="secondary">Open another Soundshow</button>
      </div>

      <div class="player-wrap">
        <iframe id="scPlayer" title="SoundCloud player" allow="autoplay"></iframe>
      </div>
    </section>
  </main>

  <script src="slideshow.js"></script>
</body>
</html>
